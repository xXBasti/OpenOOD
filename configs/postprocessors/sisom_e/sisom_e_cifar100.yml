postprocessor:
  name: sisom
  APS_mode: False
  search_sigmoid: False
  postprocessor_args:
    coverage_method: DSC
    coverage_hyper: 0.75
    num_classes: 100
    build_ratio: 0.1
    dataset: cifar100
    gain_mode: energy
    surprise_strategy: energy
    build_method: probcover
    graph_radius: 5
    input_size : [1,3,32,32]
    fixed_ratio: 0.2
  layer_kwargs:
    AdaptiveAvgPool2d-1: 1
    Sequential-3: 0.1
    Sequential-2: 0.1
    Sequential-1: 0.1
  postprocessor_sweep:
    # cross
    AdaptiveAvgPool2d-1: [1,50,100]
    Sequential-3: [0.1,10,100]
    Sequential-2: [0.1,1]
    Sequential-1: [0.1,1]